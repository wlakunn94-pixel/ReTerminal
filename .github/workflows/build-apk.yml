name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.build_type || 'debug' }} APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Build debug APK
        if: inputs.build_type != 'release'
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare release signing files
        if: inputs.build_type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          SIGNING_PROPERTIES_BASE64: ${{ secrets.PROP }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > /tmp/xed.keystore
          else
            : > /tmp/xed.keystore
          fi

          if [ -n "$SIGNING_PROPERTIES_BASE64" ]; then
            printf '%s' "$SIGNING_PROPERTIES_BASE64" | base64 --decode > /tmp/signing.properties
          else
            : > /tmp/signing.properties
          fi

      - name: Build release APK
        if: inputs.build_type == 'release'
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload debug APK
        if: inputs.build_type != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: reterminal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        if: inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: reterminal-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
